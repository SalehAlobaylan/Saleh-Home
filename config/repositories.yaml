# Registry of the Saleh-Home workspace.
# These values document reality and intent. They do not configure or verify
# GitHub permissions, and MUST NOT be used as a publishing security mechanism.
# The export gate in scripts/export-public.mjs is the security boundary.
repositories:

  saleh-home:
    repository: SalehAlobaylan/Saleh-Home
    role: personal-workspace
    visibility: private
    local_path: .
    submodule: false
    note: Private Git superproject. Tracks submodule pointers, workspace docs, and publishing orchestration.

  salehspace:
    repository: SalehAlobaylan/SalehSpace
    role: personal-website
    visibility: public
    local_path: repos/salehspace
    submodule: true
    branch: main

  salehalobaylan:
    repository: SalehAlobaylan/SalehAlobaylan
    role: public-identity
    visibility: public
    local_path: repos/salehalobaylan
    submodule: true
    branch: main
    note: Special GitHub profile repository. Must remain independent; never merge into Saleh-Home.

  knowledge-vault:
    repository: SalehAlobaylan/knowledge-vault
    role: knowledge-source
    visibility: private
    local_path: repos/knowledge-vault
    submodule: true
    branch: main
    note: Canonical private Obsidian source.

  knowledge-web:
    repository: SalehAlobaylan/knowledge-web
    role: knowledge-publisher
    visibility: private
    intended_visibility: public-eventually
    local_path: repos/knowledge-web
    submodule: true
    branch: main
    note: Quartz publisher. Upstream is jackyzha0/quartz. Keep private until public deployment is ready.

  personal-docs:
    repository: SalehAlobaylan/personal-docs
    role: personal-documentation
    visibility: private
    local_path: repos/personal-docs
    submodule: true
    branch: main
    note: Private professional docs.
